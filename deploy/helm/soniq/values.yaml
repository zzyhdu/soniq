nameOverride: ""
fullnameOverride: ""

namespace:
  create: false
  name: ""

commonLabels: {}
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  automountToken: false

networkPolicy:
  enabled: true
  allowedEgressTCPPorts:
    - 80
    - 443
    - 9000
    - 5432
    - 7233
  api:
    ingress:
      from: []
    extraEgress: []
  worker:
    extraEgress: []
  migrate:
    extraEgress: []

config:
  name: ""
  data:
    APP_ENV: production
    APP_PUBLIC_URL: https://soniq.example.com
    LOG_FORMAT: json
    LOG_LEVEL: info
    AUTH_SESSION_TTL_HOURS: "720"
    AUTH_COOKIE_SECURE: "true"
    API_ADDRESS: :8080
    TEMPORAL_ADDRESS: temporal-frontend.temporal.svc.cluster.local:7233
    TEMPORAL_NAMESPACE: default
    TEMPORAL_TASK_QUEUE: soniq-audio-pipeline
    WORKER_MAX_CONCURRENT_WORKFLOW_TASKS: "20"
    WORKER_MAX_CONCURRENT_ACTIVITIES: "4"
    WORKER_MAX_CONCURRENT_LOCAL_ACTIVITIES: "4"
    WORKER_TASK_QUEUE_ACTIVITIES_PER_SECOND: "0"
    PURGE_ARTIFACT_CLEANUP_INTERVAL_SECONDS: "300"
    PURGE_ARTIFACT_CLEANUP_BATCH_SIZE: "25"
    STORAGE_PROVIDER: s3_compatible
    S3_ENDPOINT: https://s3.example.com
    S3_REGION: us-east-1
    S3_BUCKET: soniq
    S3_FORCE_PATH_STYLE: "false"
    TRANSCRIPTION_PROVIDER: fake_transcription
    TRANSCRIPTION_BASE_URL: https://api.xiaomimimo.com/v1
    TRANSCRIPTION_MODEL: mimo-v2.5-asr
    TRANSCRIPTION_AUTH_HEADER: api-key
    TRANSCRIPTION_LANGUAGE: auto
    DASHSCOPE_BASE_URL: https://dashscope.aliyuncs.com/api/v1
    DASHSCOPE_ASR_MODEL: paraformer-v2
    LLM_PROVIDER: fake_llm
    LLM_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
    LLM_MODEL: qwen3.7-plus
    PRIVACY_ALLOW_EXTERNAL_MODEL_PROVIDERS: "false"
    PRIVACY_DELETE_ORIGINAL_AUDIO_AFTER_TRANSCRIPTION: "false"

secret:
  create: false
  name: ""
  stringData: {}

api:
  replicas: 2
  terminationGracePeriodSeconds: 30
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  pdb:
    enabled: true
    minAvailable: 1
    maxUnavailable: null
  image:
    repository: soniq-api
    tag: dev
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
    targetPort: http
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

worker:
  replicas: 2
  terminationGracePeriodSeconds: 30
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  pdb:
    enabled: true
    minAvailable: 1
    maxUnavailable: null
  image:
    repository: soniq-worker
    tag: dev
    pullPolicy: IfNotPresent
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

migrate:
  enabled: true
  serviceAccountName: ""
  backoffLimit: 3
  restartPolicy: OnFailure
  hook:
    enabled: true
    weight: -5
    deletePolicy: before-hook-creation,hook-succeeded
  image:
    repository: soniq-migrate
    tag: dev
    pullPolicy: IfNotPresent
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
