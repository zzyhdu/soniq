{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "soniq.migrateName" . }}
  namespace: {{ include "soniq.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "soniq.migrateName" . }}
    app.kubernetes.io/component: migrate
    {{- include "soniq.commonLabels" . | nindent 4 }}
  {{- if .Values.migrate.hook.enabled }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": {{ .Values.migrate.hook.weight | quote }}
    "helm.sh/hook-delete-policy": {{ .Values.migrate.hook.deletePolicy | quote }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "soniq.migrateName" . }}
        app.kubernetes.io/component: migrate
        {{- include "soniq.commonLabels" . | nindent 8 }}
      {{- with .Values.migrate.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: {{ .Values.migrate.restartPolicy }}
      automountServiceAccountToken: false
      {{- if .Values.migrate.hook.enabled }}
      {{- with .Values.migrate.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- else }}
      serviceAccountName: {{ include "soniq.serviceAccountName" . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.migrate.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.migrate.image.repository }}:{{ .Values.migrate.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy }}
          {{- if .Values.migrate.hook.enabled }}
          env:
            {{- range $key, $value := .Values.config.data }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "soniq.secretName" . }}
          {{- else }}
          envFrom:
            - configMapRef:
                name: {{ include "soniq.configName" . }}
            - secretRef:
                name: {{ include "soniq.secretName" . }}
          {{- end }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.migrate.securityContext | nindent 12 }}
{{- end }}
