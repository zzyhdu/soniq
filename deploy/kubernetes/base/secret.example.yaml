apiVersion: v1
kind: Secret
metadata:
  name: soniq-secret
  namespace: soniq
  labels:
    app.kubernetes.io/name: soniq
    app.kubernetes.io/part-of: soniq
type: Opaque
stringData:
  POSTGRES_DSN: postgres://soniq_user:change-me@postgres.example.com:5432/soniq?sslmode=require
  S3_ACCESS_KEY: change-me
  S3_SECRET_KEY: change-me
  TRANSCRIPTION_API_KEY: ""
  MIMO_API_KEY: ""
  DASHSCOPE_API_KEY: ""
  LLM_API_KEY: ""
