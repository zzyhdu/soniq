apiVersion: apps/v1
kind: Deployment
metadata:
  name: soniq-worker
  namespace: soniq
  labels:
    app.kubernetes.io/name: soniq-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: soniq
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: soniq-worker
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soniq-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: soniq
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: soniq-worker
              app.kubernetes.io/component: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: worker
          image: soniq-worker:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9091
          envFrom:
            - configMapRef:
                name: soniq-config
            - secretRef:
                name: soniq-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
