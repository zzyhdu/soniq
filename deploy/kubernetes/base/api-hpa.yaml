apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: soniq-api
  namespace: soniq
  labels:
    app.kubernetes.io/name: soniq-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: soniq
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: soniq-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
