apiVersion: apps/v1
kind: Deployment
metadata:
  name: soniq-api
  namespace: soniq
  labels:
    app.kubernetes.io/name: soniq-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: soniq
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: soniq-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soniq-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: soniq
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: soniq-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: soniq-config
            - secretRef:
                name: soniq-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
