global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: soniq-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: soniq-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9091

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: otel-collector-exported-metrics
    static_configs:
      - targets:
          - otel-collector:8889
