services:
  soniq-postgresql:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: soniq_user
      POSTGRES_PASSWORD: soniq_password
      POSTGRES_DB: soniq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soniq_user"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - soniq-postgres-data:/var/lib/postgresql

  temporal-postgresql:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.29.6.1
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: temporal-postgresql
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.51.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: soniq_minio_user
      MINIO_ROOT_PASSWORD: soniq_minio_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc alias set local http://127.0.0.1:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1 && mc ready local",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - soniq-minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set soniq http://minio:9000 soniq_minio_user soniq_minio_password
        mc mb --ignore-existing soniq/soniq
        mc anonymous set none soniq/soniq
    restart: "no"

volumes:
  soniq-postgres-data:
  temporal-postgres-data:
  soniq-minio-data:
